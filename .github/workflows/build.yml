name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libffi-dev libssl-dev
        # pip को <24 पर लॉक कर रहे हैं ताकि pip._internal.exceptions का एरर न आए
        pip install --upgrade "pip<24" setuptools wheel
        pip install --upgrade buildozer cython==0.29.33

    - name: Set Android SDK environment
      run: |
        echo "ANDROID_SDK_ROOT=${{ runner.temp }}/android-sdk" >> $GITHUB_ENV
        echo "ANDROID_HOME=${{ runner.temp }}/android-sdk" >> $GITHUB_ENV
        echo "PATH=${{ runner.temp }}/android-sdk/cmdline-tools/latest/bin:${{ runner.temp }}/android-sdk/platform-tools:${PATH}" >> $GITHUB_ENV

    - name: Download Android command-line tools
      run: |
        mkdir -p "${{ runner.temp }}/android-sdk/cmdline-tools"
        curl -fsSL -o /tmp/commandlinetools.zip https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
        unzip -q /tmp/commandlinetools.zip -d "${{ runner.temp }}/android-sdk/cmdline-tools"
        mv "${{ runner.temp }}/android-sdk/cmdline-tools/cmdline-tools" "${{ runner.temp }}/android-sdk/cmdline-tools/latest"

    - name: Install Android SDK packages & Fix Buildozer Path
      env:
        ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk
        JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      run: |
        set -e
        sdkmanager="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
        chmod +x "$sdkmanager"
        yes | "$sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" "platform-tools" "platforms;android-33" "build-tools;33.0.2"
        yes | "$sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" --licenses || true
        
        # Link SDK to Buildozer's expected path
        mkdir -p "$HOME/.buildozer/android/platform"
        ln -sfn "$ANDROID_SDK_ROOT" "$HOME/.buildozer/android/platform/android-sdk"
        mkdir -p "$HOME/.buildozer/android/platform/android-sdk/tools/bin"
        ln -sfn "$sdkmanager" "$HOME/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager"

    - name: Build APK with Buildozer
      run: |
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
