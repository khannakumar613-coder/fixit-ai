name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.14.2
      uses: actions/setup-python@v5
      with:
        python-version: '3.14.2'

    - name: Install System Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          autoconf automake libtool libtool-bin autoconf-archive pkg-config m4 \
          build-essential ca-certificates gcc g++ make bison flex gettext \
          libffi-dev libssl-dev libbz2-dev libsqlite3-dev zlib1g-dev \
          libreadline-dev libncurses5-dev libncursesw5-dev libgdbm-dev libdb-dev \
          tk-dev uuid-dev liblzma-dev libltdl-dev openjdk-17-jdk
        
        sudo libtoolize --install --copy --force 2>/dev/null || true

    - name: Cache Buildozer & Android SDK
      uses: actions/cache@v4
      with:
        path: |
          ~/.buildozer
          .buildozer
        key: ${{ runner.os }}-buildozer-v3-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          ${{ runner.os }}-buildozer-v3-

    - name: Install Buildozer and Dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install --upgrade buildozer cython

    - name: Build APK with Buildozer
      env:
        ACLOCAL_PATH: /usr/share/aclocal:/usr/local/share/aclocal
      run: |
        yes | buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
