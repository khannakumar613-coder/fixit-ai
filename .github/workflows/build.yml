name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install System Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          autoconf automake libtool libtool-bin autoconf-archive pkg-config m4 \
          build-essential ca-certificates gcc g++ make bison flex gettext \
          libffi-dev libssl-dev libbz2-dev libsqlite3-dev zlib1g-dev \
          libreadline-dev libncurses5-dev libncursesw5-dev libgdbm-dev libdb-dev \
          tk-dev uuid-dev liblzma-dev libltdl-dev openjdk-17-jdk
        
        sudo libtoolize --install --copy --force 2>/dev/null || true

    - name: Cache Buildozer & Android SDK
      uses: actions/cache@v4
      with:
        path: |
          ~/.buildozer
          .buildozer
        key: ${{ runner.os }}-buildozer-v8-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          ${{ runner.os }}-buildozer-v8-

    - name: Install Compatible Pip, Buildozer and Python-for-Android
      run: |
        python -m pip install --upgrade "pip==23.2.1" "setuptools==67.8.0" "wheel==0.38.4"
        python -m pip install --upgrade "buildozer==1.5.0" "cython==0.29.33" "python-for-android"

    - name: Build APK with Buildozer
      env:
        ACLOCAL_PATH: /usr/share/aclocal:/usr/local/share/aclocal
        PIP_VERSION: "23.2.1"
      run: |
        python -m pip install --upgrade "pip==23.2.1"
        
        # 1. सभी आंतरिक/कैश्ड build venvs में pip 23.2.1 को फ़ोर्स-अपग्रेड करना
        for py in $(find ~/.buildozer -type f -path "*/venv/bin/python" 2>/dev/null || true); do
          "$py" -m pip install --upgrade "pip==23.2.1" || true
        done

        # 2. Helper venv पाथ को सही करना
        mkdir -p ~/.buildozer/android/platform/build-python-for-android/venv/bin
        if [ -f ~/.buildozer/android/platform/build-python-for-android/venv/bin/python ]; then
          ~/.buildozer/android/platform/build-python-for-android/venv/bin/python -m pip install --upgrade "pip==23.2.1" || true
        fi

        # 3. APK बिल्ड प्रोसेस शुरू करना
        yes | buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
